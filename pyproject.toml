[project]
name = "intel-agent"
version = "0.1.0"
description = "Self-contained, domain-adaptable LangGraph agent runtime — manifest + domain-plugin composition over a swappable set of backing services."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "truongpx396", email = "truongpx396@gmail.com" }]

# Runtime deps are the GENERIC runtime only. Anything a host supplies through a
# port (a vector store client, a bus client, a provider SDK) belongs in an extra,
# never here — a Profile-B install must not drag in Qdrant or NATS.
# See specs/001-agent-runtime/contracts/agent-runtime.md, backing-service swap matrix.
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=1.40",          # OpenAI-wire client, pointed at ANY gateway base-URL
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# --- retrieval backends (RetrievalService port; pick exactly one per deployment) --
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]   # Profile B: one store, RLS floor
qdrant = ["qdrant-client>=1.10"]                        # Profile A: AISAT reference

# --- bus backends (Bus port) --------------------------------------------------
# `inprocess` needs nothing — that is the point, and why it is not listed here.
redis = ["redis>=5.0"]                                  # redis_streams + RedisSaver
jetstream = ["nats-py>=2.7"]                            # Profile A

# --- optional capabilities (all degrade cleanly when absent) ------------------
memory = ["mem0ai>=0.1"]
mcp = ["fastmcp>=2.0"]
observability = ["langfuse>=2.40", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]

# The shape a host installs to run the reference profile end-to-end.
profile-a = ["intel-agent[qdrant,jetstream,redis,memory,mcp,observability]"]
# The shape that must boot with no Qdrant and no NATS anywhere in the tree.
profile-b = ["intel-agent[pgvector,redis,memory,mcp,observability]"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# Ports are Protocols consumed by other repos; an untyped one is a broken contract.
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires containerized backing services (testcontainers)",
    "conformance: port conformance suite — also run by host repos",
    "smoke: Profile-B standalone smoke (no Qdrant, no NATS)",
]

[tool.coverage.run]
source = ["src/intel_agent"]
