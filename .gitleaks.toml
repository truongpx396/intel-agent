# gitleaks config for aisat-intel (used by the CI secret-scan job).
# Extends the full default ruleset; only adds an allowlist for the placeholder
# values that live in committed *.example templates (never real secrets).
title = "aisat-intel gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Placeholders in committed example/template files are not real secrets."
paths = [
  '''.*\.example$''',
  '''.*\.example\..*$''',
]
regexes = [
  '''change-me[a-z0-9-]*''',
  '''REPLACE[_A-Z]*''',
]
